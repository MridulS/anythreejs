name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Unit, protocol & performance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync environment
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check src/ tests/
      - name: Format check
        run: uv run ruff format --check src/ tests/
      - name: Verify committed widget bundle is current
        run: |
          npm ci
          npm run build
          git diff --exit-code src/anythreejs/static/widget.js
      - name: Verify committed type stubs are current
        run: |
          uv run python scripts/generate_stubs.py
          git diff --exit-code 'src/anythreejs/core/*.pyi'
      - name: Run tests (browser tests skip without a browser)
        run: uv run pytest tests/ -q

  browser:
    name: Playwright browser harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync environment
        run: uv sync --group dev
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      # The harness serves the committed self-contained bundle with the
      # browser forced offline — no network at runtime. Golden baselines are
      # per-platform; on a runner without linux baselines the golden tests
      # write them and skip — download the artifact and commit the PNGs to
      # activate golden checks in CI.
      - name: Run browser tests (functional, benchmarks, goldens)
        run: >-
          uv run pytest tests/test_browser.py tests/test_browser_perf.py
          tests/test_golden.py -q -s
      - name: Upload freshly written golden baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-baselines-linux
          path: tests/golden/*.linux.png
          if-no-files-found: ignore

  plopp-drop-in:
    name: Drop-in gate (unmodified upstream plopp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync environment
        run: uv sync --group dev
      - name: Fetch unmodified upstream plopp (imports pythreejs)
        run: git clone --depth 1 https://github.com/scipp/plopp upstream-plopp
      - name: Install upstream plopp and scientific deps
        run: |
          uv pip install -e ./upstream-plopp scipp xarray h5py pooch
          uv pip install --reinstall --no-deps -e .
      # tests/shims/pythreejs.py aliases pythreejs -> anythreejs, so this
      # runs upstream's own 3D suites, byte-for-byte unmodified, against us.
      - name: Run upstream 3D suites through the pythreejs shim
        run: >-
          PYTHONPATH=tests/shims uv run --no-sync pytest
          upstream-plopp/tests/plotting/scatter3d_test.py
          upstream-plopp/tests/plotting/mesh3d_test.py
          -q -W "ignore::PendingDeprecationWarning"

  matplotgl:
    name: Drop-in gate (unmodified upstream matplotgl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync environment
        run: uv sync --group dev
      # Upstream matplotgl still imports pythreejs; the shim aliases it to
      # anythreejs (PYTHONPATH shadows the installed pythreejs), so this
      # gates the drop-in claim exactly like the plopp job.
      - name: Fetch unmodified upstream matplotgl
        run: git clone --depth 1 https://github.com/scipp/matplotgl external/matplotgl
      - name: Install matplotgl and reassert local anythreejs
        run: |
          uv pip install -e ./external/matplotgl
          uv pip install --reinstall --no-deps -e .
      - name: Integration tests through the pythreejs shim
        run: >-
          PYTHONPATH=tests/shims uv run --no-sync pytest
          tests/test_matplotgl_compat.py -q
      - name: matplotgl's own test suite through the shim
        run: >-
          PYTHONPATH=tests/shims uv run --no-sync pytest
          external/matplotgl/tests -q

  plopp:
    name: plopp compatibility gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync environment
        run: uv sync --group dev
      - name: Fetch plopp (anythreejs branch)
        run: git clone --depth 1 --branch anythreejs https://github.com/MridulS/plopp external/plopp
      - name: Install plopp and scientific deps
        run: |
          uv pip install -e ./external/plopp scipp xarray h5py pooch
          uv pip install --reinstall --no-deps -e .
      - name: Integration tests
        run: uv run --no-sync pytest tests/test_plopp_compat.py -q
      - name: plopp's own 3D test suites
        run: >-
          uv run --no-sync pytest
          external/plopp/tests/plotting/scatter3d_test.py
          external/plopp/tests/plotting/mesh3d_test.py
          -q -W "ignore::PendingDeprecationWarning"
